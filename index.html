<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마을 문제 지도 초안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout idea: a full-screen map app. Floating search and chips on top, a place panel on the left, round controls in the corners. */
:root{
  --surface:#ffffff; --ink:#202124; --muted:#5f6368; --line:#dadce0; --hover:#f1f3f4;
  --blue:#1a73e8; --blue-soft:#e8f0fe;
  --c-water:#1a73e8; --c-power:#f29900; --c-road:#5f6368; --c-san:#188038; --c-fac:#9334e6;
  --ok:#188038; --warn:#b06000; --crit:#c5221f;
  --shadow:0 1px 2px rgba(60,64,67,.3),0 2px 6px 2px rgba(60,64,67,.15);
  --f:"Roboto","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f);font-size:14px;line-height:1.5;color:var(--ink);background:#e8eaed;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
#map{position:absolute;inset:0;z-index:0;background:#e8eaed}
#map.pick,#map.pick .leaflet-interactive{cursor:crosshair}
.leaflet-container{font-family:var(--f)}
.leaflet-bar{border:0!important;box-shadow:var(--shadow)!important;border-radius:8px!important;overflow:hidden}
.leaflet-bar a{width:40px!important;height:40px!important;line-height:40px!important;color:#666!important;font-size:22px!important}
.leaflet-bottom.leaflet-right .leaflet-control-zoom{margin:0 12px 34px 0}
.pin{background:none;border:0}
.pin svg{display:block;transform-origin:50% 95%;transition:transform .12s;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.pin.on svg{transform:scale(1.35)}
.pin:focus-visible{outline:none}
.pin:focus-visible svg{transform:scale(1.35)}

/* top bar */
.top{position:absolute;z-index:1100;left:12px;right:12px;top:12px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
.top>*{pointer-events:auto}
.searchwrap{position:relative;flex:0 0 376px;max-width:100%}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);height:48px;padding:0 8px 0 16px}
.search svg{flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px}
.search .x{border:0;background:transparent;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.search .x:hover{background:var(--hover)}
.results{position:absolute;left:0;right:0;top:54px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;padding:6px 0}
.results button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:8px 16px}
.results button:hover,.results button:focus-visible{background:var(--hover)}
.results .sub{color:var(--muted);font-size:12.5px;display:block}
.results .empty{padding:8px 16px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 8px;flex:1 1 auto;min-width:0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 10px;border-radius:18px;border:0;background:var(--surface);box-shadow:var(--shadow);font-weight:500;white-space:nowrap}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--c)}
.chip[aria-pressed="false"]{color:var(--muted);background:#f1f3f4;box-shadow:none;border:1px solid var(--line)}
.chip[aria-pressed="false"] i{background:transparent}
.chip.t{padding-left:14px}
.chip.t[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue)}
.tools{display:flex;gap:8px;flex:none;padding:6px 0}
.pillbtn{height:36px;border-radius:18px;border:0;background:var(--surface);box-shadow:var(--shadow);padding:0 14px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pillbtn:hover{background:#f8f9fa}
.seg{display:inline-flex;height:36px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.seg button{border:0;background:transparent;padding:0 12px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue)}

/* left panel */
.panel{position:absolute;z-index:1000;left:0;top:0;bottom:0;width:400px;max-width:100%;background:var(--surface);box-shadow:0 0 20px rgba(0,0,0,.3);display:flex;flex-direction:column}
.panel .scroll{overflow-y:auto;padding:76px 0 24px;flex:1}
.hero{height:112px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));display:flex;align-items:flex-end;padding:12px 24px;color:#fff;font-weight:500;letter-spacing:.02em}
.sec{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec:last-child{border-bottom:0}
.sec h2{font-size:22px;font-weight:400;margin:0;line-height:1.3;text-wrap:balance}
.sec h3{font-size:14px;font-weight:500;margin:0}
.sec p{margin:0}
.sub{color:var(--muted)}
.rowline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acts{display:flex;gap:6px;justify-content:space-around;padding:12px 16px;border-bottom:1px solid var(--line)}
.act{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--blue);font-weight:500;padding:4px 8px;border-radius:8px;min-width:76px}
.act span.ic{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.act.main span.ic{background:var(--blue);border-color:var(--blue)}
.act:hover span.ic{background:var(--blue-soft)} .act.main:hover span.ic{background:#1765cc}
.info{display:grid;grid-template-columns:24px 1fr;gap:12px 16px;align-items:start;margin:0}
.info dt{color:var(--blue);display:grid;place-items:center;height:21px}
.info dd{margin:0}
.info dd small{display:block;color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:500;border:1px solid var(--pc);color:var(--pc);white-space:nowrap}
.pill.rec{--pc:var(--muted)} .pill.conf{--pc:var(--blue)} .pill.prog{--pc:var(--warn)} .pill.done{--pc:var(--ok)} .pill.hard{--pc:var(--crit)}
.pill.done{background:var(--ok);color:#fff}
.cat{display:inline-flex;align-items:center;gap:6px}
.cat i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tl .d{color:var(--muted);font-size:12px;margin-right:6px}
.recs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.recs li{background:#f8f9fa;border-radius:8px;padding:8px 12px}
.recs .k{font-size:12px;color:var(--muted);display:block}
.cms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cms li{border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.cms .meta{font-size:12px;color:var(--muted);margin-left:auto}
.cms p{overflow-wrap:anywhere}
.pill.g-ok{--pc:var(--ok)} .pill.g-care{--pc:var(--warn)} .pill.g-no{--pc:var(--crit)}
.pill.g-no{background:var(--crit);color:#fff}
form.stack{display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:14px;color:var(--ink);background:#fff}
label.f textarea{min-height:68px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:8px;align-items:center}
.err{color:var(--crit);font-size:13px}
.hint{color:var(--muted);font-size:12.5px}
.btn{height:36px;border-radius:18px;border:1px solid var(--line);background:#fff;color:var(--blue);padding:0 20px;font-weight:500}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1765cc}
.closebtn{position:absolute;top:66px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:var(--shadow);display:grid;place-items:center;z-index:2}

/* corners */
.fab{position:absolute;z-index:900;right:12px;bottom:132px;height:48px;border-radius:24px;border:0;background:var(--blue);color:#fff;font-weight:500;padding:0 20px 0 14px;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:8px}
.fab:hover{background:#1765cc}
.layerbtn{position:absolute;z-index:900;left:12px;bottom:34px;width:72px;height:72px;border-radius:10px;border:2px solid #fff;box-shadow:var(--shadow);padding:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;font-size:12px;font-weight:500;color:#fff;transition:left .2s}
.layerbtn span{background:rgba(0,0,0,.55);width:100%;padding:3px 0}
.layerbtn.sat{background:linear-gradient(160deg,#2f4a2c,#55713f 45%,#2c5a73)}
.layerbtn.road{background:linear-gradient(160deg,#f3efe6 0 38%,#fff 38% 46%,#f3efe6 46% 62%,#aad3df 62%)}
.legend{position:absolute;z-index:900;left:96px;bottom:34px;background:var(--surface);border-radius:10px;box-shadow:var(--shadow);padding:8px 12px;display:flex;gap:14px;align-items:center;font-size:12.5px;transition:left .2s;max-width:calc(100% - 180px);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
body.panel-open .layerbtn{left:412px} body.panel-open .legend{left:496px}
.notice{position:absolute;z-index:900;left:50%;transform:translateX(-50%);bottom:6px;background:rgba(32,33,36,.82);color:#fff;border-radius:12px;padding:2px 12px;font-size:12px;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.pickbar{position:absolute;z-index:1050;left:50%;transform:translateX(-50%);top:76px;background:var(--ink);color:#fff;border-radius:24px;padding:8px 8px 8px 18px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
.pickbar button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:16px;height:32px;padding:0 14px}
.btn.danger{color:var(--crit)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#f1f3f4}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(32,33,36,.72);color:#fff;font-size:16px;line-height:1;display:grid;place-items:center}
.filebtn{display:inline-flex;align-items:center;align-self:flex-start;cursor:pointer;position:relative}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
.filebtn:focus-within{outline:2px solid var(--blue);outline-offset:2px}
.locbtn{position:absolute;z-index:900;right:12px;bottom:192px;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:#666}
.locbtn:hover{background:#f8f9fa}
.locbtn.on{color:var(--blue)}
.locbtn.busy{animation:locpulse 1s ease-in-out infinite}
@keyframes locpulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.locbtn.busy{animation:none;opacity:.6}}
.toast{position:absolute;z-index:1300;left:50%;transform:translateX(-50%);bottom:40px;background:var(--ink);color:#fff;border-radius:8px;padding:10px 16px;box-shadow:var(--shadow);max-width:calc(100% - 24px);text-align:center}
.offline{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

/* list sheet */
.scrim{position:absolute;inset:0;z-index:1200;background:rgba(32,33,36,.45);display:flex;justify-content:center;align-items:flex-start;padding:24px 16px;overflow-y:auto}
.sheet{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:1000px;padding:20px 24px 24px;display:flex;flex-direction:column;gap:18px}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet h2{margin:0;font-size:22px;font-weight:400}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.stat{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.stat h3{margin:0;font-size:13px;font-weight:500;color:var(--muted)}
.big{display:flex;gap:22px}
.big div{display:flex;flex-direction:column}
.big b{font-size:30px;font-weight:400;line-height:1.1}
.big span{font-size:12.5px;color:var(--muted)}
.meter{height:8px;border-radius:4px;background:#e8eaed;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.cbar{display:grid;grid-template-columns:76px 1fr 24px;gap:8px;align-items:center}
.cbar .track{display:flex;gap:3px;height:14px}
.cbar .track i{height:100%;border-radius:3px;background:var(--c);border:2px solid var(--c)}
.cbar .track i.solved{background:transparent}
.cbar .n{text-align:right}
.srow{display:flex;justify-content:space-between;align-items:center}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap;background:#f8f9fa}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
td.t{font-weight:500}
td.t .sub{display:block;font-weight:400;font-size:13px;max-width:46ch}

@media (max-width:900px){
  .top{flex-wrap:wrap;gap:4px 10px}
  .searchwrap{flex:1 1 100%}
  .chips{flex:1 1 100%;padding-bottom:4px}
  .tools{flex:1 1 100%;overflow-x:auto;padding:2px 4px 6px}
  .panel{top:auto;height:58%;width:100%;border-radius:16px 16px 0 0}
  .panel .scroll{padding-top:0}
  .closebtn{top:10px}
  body.panel-open .layerbtn,body.panel-open .legend,body.panel-open .fab,body.panel-open .locbtn,body.panel-open .notice{display:none}
  .legend{left:12px;bottom:114px;max-width:calc(100% - 24px)}
  .pickbar{top:150px}
}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="searchwrap">
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#5f6368" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>
      <input id="q" type="search" autocomplete="off">
      <button type="button" class="x" id="q-clear" hidden><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#5f6368" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
    </div>
    <div class="results" id="results" hidden></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="tools">
    <button type="button" class="pillbtn" id="open-list"></button>
    <div class="seg" role="group" aria-label="Who is viewing">
      <button type="button" id="r-school"></button><button type="button" id="r-public"></button>
    </div>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" id="l-ko">한국어</button><button type="button" id="l-en">EN</button>
    </div>
  </div>
</div>

<div class="pickbar" id="pickbar" hidden><span id="pickmsg"></span><button type="button" id="pick-here"></button><button type="button" id="pick-cancel"></button></div>

<aside class="panel" id="panel" hidden>
  <button type="button" class="closebtn" id="panel-close"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#5f6368" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
  <div class="scroll" id="panel-body" aria-live="polite"></div>
</aside>

<button type="button" class="fab" id="add"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg><span id="add-l"></span></button>
<button type="button" class="locbtn" id="locate"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8m8.94 3A8.99 8.99 0 0 0 13 3.06V1h-2v2.06A8.99 8.99 0 0 0 3.06 11H1v2h2.06A8.99 8.99 0 0 0 11 20.94V23h2v-2.06A8.99 8.99 0 0 0 20.94 13H23v-2zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14"/></svg></button>
<div class="toast" id="toast" role="status" hidden></div>
<button type="button" class="layerbtn sat" id="layer"><span id="layer-l"></span></button>
<div class="legend" id="legend"></div>
<div class="notice" id="notice"></div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h">
    <header><h2 id="sheet-h"></h2><span class="rowline"><button type="button" class="btn" id="sheet-reset"></button><button type="button" class="btn" id="sheet-close"></button></span></header>
    <div class="stats" id="stats"></div>
    <div class="tablebox"><table id="table"></table></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ---------- words ---------- */
const T={
 place:{ko:'필리핀 레이테주 타나우안, 바랑가이 산 로케',en:'Barangay San Roque, Tanauan, Leyte, Philippines'},
 search:{ko:'마을 문제 검색',en:'Search village problems'},
 list:{ko:'목록과 통계',en:'List & stats'},
 rSchool:{ko:'학교·봉사팀',en:'School & team'}, rPublic:{ko:'공개 보기',en:'Public'},
 add:{ko:'문제 기록',en:'Record a problem'},
 pickMsg:{ko:'지도에서 문제가 있는 곳을 누르세요',en:'Click the place where the problem is'},
 cancel:{ko:'취소',en:'Cancel'}, close:{ko:'닫기',en:'Close'}, save:{ko:'저장',en:'Save'},
 sat:{ko:'위성',en:'Satellite'}, road:{ko:'지도',en:'Map'},
 nSchool:{ko:'지도는 실제 지도이고, 표시된 문제는 모두 지어낸 예시입니다 · 학교·봉사팀 보기',en:'The map is real. Every problem shown is an invented example · School & team view'},
 nPublic:{ko:'지도는 실제 지도이고, 표시된 문제는 모두 지어낸 예시입니다 · 공개된 문제만 보는 중',en:'The map is real. Every problem shown is an invented example · Public problems only'},
 openOnly:{ko:'해결 안 된 것만',en:'Unsolved only'},
 lgFill:{ko:'그대로',en:'Still a problem'}, lgRing:{ko:'해결됨',en:'Solved'}, lgX:{ko:'해결 어려움',en:'Hard to solve'},
 kind:{ko:'종류',en:'Kind'}, date:{ko:'기록한 날',en:'Recorded'}, who:{ko:'알려준 사람',en:'Told by'}, coord:{ko:'위도, 경도',en:'Latitude, longitude'},
 since:{ko:'언제부터',en:'Since'}, affected:{ko:'누가 불편한가',en:'Who is affected'},
 status:{ko:'상태',en:'Status'}, vis:{ko:'공개 여부',en:'Visibility'}, pub:{ko:'공개',en:'Public'}, priv:{ko:'비공개',en:'Private'},
 history:{ko:'그동안의 변화',en:'What has changed'}, records:{ko:'측정값과 수리 기록',en:'Measurements and repairs'},
 measure:{ko:'물 지도 측정값',en:'Water map reading'}, repair:{ko:'수리 기록장',en:'Repair log'},

async function flush(){

      else if(o.t==='cm'){if(o.id>0)await api('/comments',{method:'POST',body:JSON.stringify({problem_id:o.id,data:o.c})});}
      else if(o.t==='del'){if(o.id>0)await api('/problems?id=eq.'+o.id,{method:'PATCH',body:JSON.stringify({data:o.data,updated_at:now})});}

function drawPanel(){

/* ---------- list + stats ---------- */
function drawSheet(){
  $('scrim').hidden=!S.list;if(!S.list)return;
  const v=visible(),n=v.length,done=v.filter(p=>p.st==='done').length,pct=n?Math.round(done/n*100):0;
  const max=Math.max(1,...Object.keys(CATS).map(k=>v.filter(p=>p.cat===k).length));
  $('sheet-h').textContent=t('list');$('sheet-close').textContent=t('close');$('sheet-reset').textContent=t('reset');$('sheet-reset').hidden=dbOn&&!(Q.length&&stuck);
  $('stats').innerHTML=`
   <div class="stat"><h3>${t('rate')}</h3><div class="big num"><div><b>${pct}%</b><span>${done} / ${n} ${t('solved')}</span></div><div><b>${n}</b><span>${t('total')}</span></div></div>
    <div class="meter" role="img" aria-label="${pct}%"><i style="width:${pct}%"></i></div></div>
   <div class="stat"><h3>${t('byKind')}</h3>
    ${Object.keys(CATS).filter(k=>S.cats.has(k)).map(k=>{const a=v.filter(p=>p.cat===k),o=a.filter(isOpen).length;
      const cell=cls=>`<i class="${cls}" style="width:${100/max}%"></i>`;
      return `<div class="cbar" style="--c:${CATS[k].c}"><span>${esc(L_(CATS[k]))}</span><span class="track">${cell('').repeat(o)}${cell('solved').repeat(a.length-o)}</span><span class="n num">${a.length}</span></div>`;}).join('')}
    <span class="hint">${t('barNote')}</span></div>
   <div class="stat"><h3>${t('byStatus')}</h3>${Object.keys(ST).map(k=>`<div class="srow">${pill(k)}<span class="num">${v.filter(p=>p.st===k).length}</span></div>`).join('')}</div>`;
  const cols=[['id','thId'],['title','thTitle'],['cat','kind'],['date','date'],['st','status'],['pub','vis']];
  const order=Object.keys(ST);
  const key=p=>({id:p.id,title:L_(p.title),cat:L_(CATS[p.cat]),date:p.date,st:order.indexOf(p.st),pub:p.pub?0:1}[S.sort.k]);
  const rows=v.slice().sort((a,b)=>{const x=key(a),y=key(b);return (x<y?-1:x>y?1:a.id-b.id)*S.sort.dir;});
  const arrow=k=>S.sort.k===k?(S.sort.dir>0?' ▲':' ▼'):'';
  $('table').innerHTML=`<thead><tr>${cols.map(([k,l])=>`<th aria-sort="${S.sort.k===k?(S.sort.dir>0?'ascending':'descending'):'none'}"><button type="button" data-sort="${k}">${t(l)}${arrow(k)}</button></th>`).join('')}</tr></thead>
   <tbody>${rows.length?rows.map(p=>`<tr data-id="${p.id}" tabindex="0"><td class="num">${pad(p.id)}</td><td class="t">${esc(L_(p.title))}<span class="sub">${esc(L_(p.desc))}</span></td><td>${catTag(p.cat)}</td><td class="num">${p.date}</td><td>${pill(p.st)} ${flagged(p)?goPill(goOf(p)):''}</td><td>${p.pub?t('pub'):t('priv')}</td></tr>`).join('')
    :`<tr><td colspan="6">${t('none')}</td></tr>`}</tbody>`;
}

/* ---------- chrome ---------- */
function drawChrome(){
  document.documentElement.lang=S.lang;
  $('q').placeholder=t('search');$('q').setAttribute('aria-label',t('search'));
  $('open-list').textContent=t('list');
  $('r-school').textContent=t('rSchool');$('r-public').textContent=t('rPublic');
  const press=(id,on)=>$(id).setAttribute('aria-pressed',on);
  press('r-school',S.role==='school');press('r-public',S.role==='public');press('l-ko',S.lang==='ko');press('l-en',S.lang==='en');
  $('add-l').textContent=t('add');$('add').hidden=S.role!=='school'||S.mode!=='idle';
  $('pickbar').hidden=S.mode!=='pick';$('pickmsg').textContent=t('pickMsg');$('pick-cancel').textContent=t('cancel');$('pick-here').textContent=t('here');
  $('locate').setAttribute('aria-label',t('myLoc'));$('locate').title=t('myLoc');
  $('panel-close').setAttribute('aria-label',t('close'));
  $('layer').className='layerbtn '+(S.sat?'road':'sat');$('layer-l').textContent=S.sat?t('road'):t('sat');
  /* save status comes first: on a narrow screen the end of this line is cut off */
  $('notice').textContent=(Q.length&&stuck?t('qWait').replace('{n}',Q.length):dbOn?t('savedDb'):t('dbOff'))+' · '+(S.role==='school'?t('nSchool'):t('nPublic'));
  $('chips').innerHTML=Object.keys(CATS).map(k=>`<button type="button" class="chip" data-cat="${k}" aria-pressed="${S.cats.has(k)}" style="--c:${CATS[k].c}"><i></i>${esc(L_(CATS[k]))}</button>`).join('')
    +`<button type="button" class="chip t" id="open-only" aria-pressed="${S.openOnly}">${t('openOnly')}</button>`
    +`<button type="button" class="chip t" id="go-only" aria-pressed="${S.goOnly}">${t('goOnly')}</button>`;
  const c='#1a73e8';
  $('legend').innerHTML=`<span>${pinSvg(c,'rec',15)}${t('lgFill')}</span><span>${pinSvg(c,'done',15)}${t('lgRing')}</span><span>${pinSvg(c,'hard',15)}${t('lgX')}</span><span>${pinSvg(c,'rec',15,'care')}${t('lgCare')}</span><span>${pinSvg(c,'rec',15,'no')}${t('lgNo')}</span>`;
}
function render(){drawChrome();drawPins();drawPanel();drawSheet();}

/* ---------- actions ---------- */
function select(id){S.sel=id;S.mode='idle';S.draft=null;S.editId=null;S.list=false;render();const p=DATA.find(x=>x.id===id);if(p)reveal(p);}
function closePanel(){S.sel=null;S.mode='idle';S.draft=null;S.editId=null;render();}
$('panel-close').onclick=closePanel;
$('pick-cancel').onclick=closePanel;
$('locate').onclick=()=>locate(()=>map.setView([me.lat,me.lng],Math.max(map.getZoom(),18)));
$('pick-here').onclick=()=>locate(()=>{
  if(S.mode!=='pick')return;
  S.draft={lat:me.lat,lng:me.lng,cat:'water'};S.mode='form';render();
  map.setView([me.lat,me.lng],Math.max(map.getZoom(),18),{animate:false});reveal(S.draft);
  const f=$('n-title');if(f)f.focus();
});
$('r-school').onclick=()=>{S.role='school';render();};
$('r-public').onclick=()=>{S.role='public';S.mode='idle';S.draft=null;S.editId=null;render();};
$('l-ko').onclick=()=>{S.lang='ko';render();};
$('l-en').onclick=()=>{S.lang='en';render();};
$('add').onclick=()=>{S.sel=null;S.draft=null;S.editId=null;S.mode='pick';render();};
$('open-list').onclick=()=>{S.list=true;render();$('sheet-close').focus();};
$('sheet-close').onclick=()=>{S.list=false;render();};
$('sheet-reset').onclick=()=>{if(!confirm(t('resetQ')))return;try{localStorage.removeItem(KEY);}catch(_){}location.reload();};
$('scrim').addEventListener('click',e=>{if(e.target===$('scrim')){S.list=false;render();}});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(S.list){S.list=false;render();}else if(!$('results').hidden)$('results').hidden=true;else if(S.mode!=='idle'||S.sel!=null)closePanel();});
$('layer').onclick=()=>{S.sat=!S.sat;if(map){map.removeLayer(S.sat?layerRoad:layerSat);map.addLayer(S.sat?layerSat:layerRoad);}drawChrome();};
$('chips').onclick=e=>{
  const c=e.target.closest('[data-cat]');
  if(c){const k=c.dataset.cat;S.cats.has(k)?S.cats.delete(k):S.cats.add(k);render();return;}
  if(e.target.closest('#open-only')){S.openOnly=!S.openOnly;render();}
  if(e.target.closest('#go-only')){S.goOnly=!S.goOnly;render();}
};
function search(){
  const q=$('q').value.trim().toLowerCase();$('q-clear').hidden=!q;
  if(!q){$('results').hidden=true;return;}
  const hits=DATA.filter(p=>(S.role==='school'||p.pub)&&[both(p.title),both(p.desc),CATS[p.cat].ko,CATS[p.cat].en,pad(p.id)].join(' ').toLowerCase().includes(q)).slice(0,6);
  $('results').innerHTML=hits.length?hits.map(p=>`<button type="button" data-id="${p.id}">${pinSvg(CATS[p.cat].c,p.st,18)}<span>${esc(L_(p.title))}<span class="sub">${esc(L_(CATS[p.cat]))} · ${esc(L_(ST[p.st]))}</span></span></button>`).join(''):`<div class="empty">${t('none')}</div>`;
  $('results').hidden=false;
}
$('q').addEventListener('input',search);$('q').addEventListener('focus',search);
$('q-clear').onclick=()=>{$('q').value='';search();$('q').focus();};
$('results').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const p=DATA.find(x=>x.id===+b.dataset.id);$('results').hidden=true;S.cats.add(p.cat);if(!isOpen(p))S.openOnly=false;if(!flagged(p))S.goOnly=false;select(p.id);reveal(p,17);};
$('panel-body').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const p=DATA.find(x=>x.id===S.sel);
  if(a.dataset.act==='cancel'){if(S.editId!=null)select(S.editId);else closePanel();return;}
  if(a.dataset.act==='editrec'&&p){S.editId=p.id;S.draft={lat:p.lat,lng:p.lng,cat:p.cat};S.mode='form';render();return;}
  if(a.dataset.act==='del'&&p){if(!confirm(t('delQ')))return;DATA=DATA.filter(x=>x!==p);enq({t:'del',id:p.id,data:{...strip(p),del:true}});closePanel();return;}
  if(a.dataset.act==='rmphoto'&&p){p.photos=(p.photos||[]).filter(x=>x.u!==a.dataset.u);enq({t:'patch',id:p.id});redraw();return;}
  if(a.dataset.act==='zoom'&&p)reveal(p,19);
  if(a.dataset.act==='cm'){$('cm-sec').scrollIntoView({behavior:'smooth'});const f=$('c-m');if(f)f.focus({preventScroll:true});}
  if(a.dataset.act==='edit'){$('upd-sec').scrollIntoView({behavior:'smooth'});$('u-st').focus({preventScroll:true});}
  if(a.dataset.act==='copy'&&p){const s=p.lat.toFixed(5)+', '+p.lng.toFixed(5);const ok=()=>{$('copy-l').textContent=t('copied');};try{navigator.clipboard.writeText(s).then(ok,()=>{});}catch(_){}}
});
$('panel-body').addEventListener('change',async e=>{
  if(e.target.id!=='ph-file')return;
  const file=e.target.files[0],id=S.sel;if(!file)return;
  $('ph-msg').textContent=t('uploading');
  try{
    const u=await upload(await shrink(file)),p=DATA.find(x=>x.id===id);if(!p)return;
    p.photos=(p.photos||[]).concat({u,d:localDate()});enq({t:'patch',id:p.id});
    if(S.sel===id&&S.mode==='idle')redraw();
  }catch(_){const m=$('ph-msg');if(m){m.textContent=t('upFail');m.className='err';}}
});
$('panel-body').addEventListener('submit',e=>{
  e.preventDefault();
  const today=localDate();
  if(e.target.id==='upd'){
    const p=DATA.find(x=>x.id===S.sel),st=$('u-st').value,memo=$('u-memo').value.trim();
    if(st==='hard'&&st!==p.st&&!memo){$('u-err').textContent=t('errHard');$('u-memo').focus();return;}
    if(st!==p.st||memo){p.st=st;p.hist.push({d:today,s:st,m:memo?one(memo):{ko:ST[st].ko,en:ST[st].en}});}
    p.pub=$('u-pub').checked;enq({t:'patch',id:p.id});render();
  }
  if(e.target.id==='cmf'){
    const p=DATA.find(x=>x.id===S.sel),m=$('c-m').value.trim(),k=$('c-k').value;
    if(!m){$('c-err').textContent=t('errCm');$('c-m').focus();return;}
    const c={d:today,who:$('c-who').value,k,m:one(m)};if(k==='go')c.go=$('c-go').value;
    p.cm.push(c);enq({t:'cm',id:p.id,c});if(S.goOnly&&!flagged(p))S.goOnly=false;render();$('cm-sec').scrollIntoView();
  }
  if(e.target.id==='newf'){
    const title=$('n-title').value.trim(),f=id=>$(id).value.trim();
    const ep=S.editId!=null?DATA.find(x=>x.id===S.editId):null;
    if(!title&&!(ep&&untr(ep.title))){$('n-err').textContent=t('errTitle');$('n-title').focus();return;}
    const cat=$('n-cat').value;
    if(ep){
      /* keep the other language's text; only this language's text is replaced */
      const setL=(k,v)=>{const o=ep[k],n=o&&typeof o==='object'?{...o}:{};if(v)n[S.lang]=v;else delete n[S.lang];ep[k]=Object.keys(n).length?n:'';};
      setL('title',title);setL('desc',f('n-desc'));setL('since',f('n-since'));setL('aff',f('n-aff'));
      ep.cat=cat;ep.who=$('n-who').value;ep.lat=S.draft.lat;ep.lng=S.draft.lng;
      enq({t:'patch',id:ep.id});S.cats.add(cat);select(ep.id);return;
    }
    const row={cat,lat:S.draft.lat,lng:S.draft.lng,date:today,who:$('n-who').value,st:'rec',pub:false,title:one(title),
      desc:one(f('n-desc')),since:one(f('n-since')),aff:one(f('n-aff')),hist:[{d:today,s:'rec',m:T.created}],recs:[]};
    /* shown at once under a temporary number; the database gives the real number when the record is uploaded */
    const id=-Date.now();
    DATA.push({...row,id,cm:[]});S.cats.add(cat);S.goOnly=false;select(id);enq({t:'new',id,row});
  }
});
$('table').addEventListener('click',e=>{
  const s=e.target.closest('[data-sort]');
  if(s){const k=s.dataset.sort;S.sort=S.sort.k===k?{k,dir:-S.sort.dir}:{k,dir:1};drawSheet();return;}
  const r=e.target.closest('tr[data-id]');if(r){const p=DATA.find(x=>x.id===+r.dataset.id);select(p.id);reveal(p,17);}
});
$('table').addEventListener('keydown',e=>{if(e.key==='Enter'){const r=e.target.closest('tr[data-id]');if(r&&e.target===r)r.click();}});

if(window.L)initMap();else $('map').innerHTML='<div class="offline">'+T.offline.ko+'<br>'+T.offline.en+'</div>';
render();
refresh();setInterval(refresh,4000);
window.addEventListener('online',()=>{flush();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
</script>
</body>
</html>

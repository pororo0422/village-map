<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 마을 물 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout idea: the same full-screen map app as the village problem map. Floating search and chips on top,
   a place panel on the left (a bottom sheet on phones), round controls in the corners. */
:root{
  --surface:#ffffff; --ink:#202124; --muted:#5f6368; --line:#dadce0; --hover:#f1f3f4;
  --blue:#1a73e8; --blue-soft:#e8f0fe;
  --ok:#188038; --warn:#b06000; --crit:#c5221f;
  --series:#bb7234; --rain:#1a73e8; --grid:#e8eaed; --axis:#dadce0;
  --shadow:0 1px 2px rgba(60,64,67,.3),0 2px 6px 2px rgba(60,64,67,.15);
  --f:"Roboto","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f);font-size:14px;line-height:1.5;color:var(--ink);background:#e8eaed;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
#map{position:absolute;inset:0;z-index:0;background:#e8eaed}
#map.pick,#map.pick .leaflet-interactive{cursor:crosshair}
.leaflet-container{font-family:var(--f)}
.leaflet-bar{border:0!important;box-shadow:var(--shadow)!important;border-radius:8px!important;overflow:hidden}
.leaflet-bar a{width:40px!important;height:40px!important;line-height:40px!important;color:#666!important;font-size:22px!important}
.leaflet-bottom.leaflet-right .leaflet-control-zoom{margin:0 12px 34px 0}
.pin{background:none;border:0}
.pin svg{display:block;overflow:visible;transform-origin:50% 95%;transition:transform .12s;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.pin.on svg{transform:scale(1.3)}
.pin:focus-visible{outline:none}
.pin:focus-visible svg{transform:scale(1.3)}

/* top bar */
.top{position:absolute;z-index:1100;left:12px;right:12px;top:12px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
.top>*{pointer-events:auto}
.searchwrap{position:relative;flex:0 0 376px;max-width:100%}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);height:48px;padding:0 8px 0 16px}
.search svg{flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px}
.search .x{border:0;background:transparent;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.search .x:hover{background:var(--hover)}
.results{position:absolute;left:0;right:0;top:54px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;padding:6px 0}
.results button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:8px 16px}
.results button:hover,.results button:focus-visible{background:var(--hover)}
.results .sub{color:var(--muted);font-size:12.5px;display:block}
.results .empty{padding:8px 16px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 8px;flex:1 1 auto;min-width:0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 11px;border-radius:18px;border:0;background:var(--surface);box-shadow:var(--shadow);font-weight:500;white-space:nowrap}
.chip svg{width:15px;height:15px;color:var(--blue)}
.chip .n{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
.chip[aria-pressed="false"]{color:var(--muted);background:#f1f3f4;box-shadow:none;border:1px solid var(--line)}
.chip[aria-pressed="false"] svg{color:var(--muted)}
.tools{display:flex;gap:8px;flex:none;padding:6px 0}
.pillbtn{height:36px;border-radius:18px;border:0;background:var(--surface);box-shadow:var(--shadow);padding:0 14px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pillbtn:hover{background:#f8f9fa}
.pillsel{height:36px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px;padding:0 6px 0 14px;font-weight:500;white-space:nowrap;position:relative}
.pillsel span{color:var(--muted);font-weight:400}
.pillsel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-weight:500;padding:0 24px 0 2px;height:34px;color:var(--blue);cursor:pointer;max-width:11em;text-overflow:ellipsis}
.pillsel::after{content:"";position:absolute;right:13px;top:15px;border:4.5px solid transparent;border-top-color:var(--blue);pointer-events:none}
.seg{display:inline-flex;height:36px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.seg button{border:0;background:transparent;padding:0 12px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue)}

/* left panel */
.panel{position:absolute;z-index:1000;left:0;top:0;bottom:0;width:400px;max-width:100%;background:var(--surface);box-shadow:0 0 20px rgba(0,0,0,.3);display:flex;flex-direction:column}
.panel .scroll{overflow-y:auto;padding:76px 0 24px;flex:1}
.hero{height:112px;background:linear-gradient(135deg,#1a73e8,#6ea8f2);display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:12px 24px;color:#fff;font-weight:500;letter-spacing:.02em}
.hero svg{width:40px;height:40px;opacity:.9}
.sec{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.sec:last-child{border-bottom:0}
.sec h2{font-size:22px;font-weight:400;margin:0;line-height:1.3;text-wrap:balance}
.sec h3{font-size:14px;font-weight:500;margin:0}
.sec p{margin:0}
.sub{color:var(--muted)}
.rowline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.tag svg{width:14px;height:14px;color:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:500;border:1px solid var(--blue);color:var(--blue);white-space:nowrap}
.pill i{width:8px;height:8px;background:var(--rain);transform:rotate(45deg)}
.acts{display:flex;gap:6px;justify-content:space-around;padding:12px 16px;border-bottom:1px solid var(--line)}
.act{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--blue);font-weight:500;padding:4px 8px;border-radius:8px;min-width:76px}
.act span.ic{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.act.main span.ic{background:var(--blue);border-color:var(--blue)}
.act:hover span.ic{background:var(--blue-soft)} .act.main:hover span.ic{background:#1765cc}
.big{display:flex;gap:22px;flex-wrap:wrap}
.big div{display:flex;flex-direction:column;min-width:0}
.big b{font-size:30px;font-weight:400;line-height:1.1;display:flex;align-items:center;gap:8px}
.big b.sm{font-size:18px;line-height:1.35}
.big span{font-size:12.5px;color:var(--muted)}
.swatch{width:12px;height:12px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.delta{color:var(--muted)}
.info{display:grid;grid-template-columns:24px 1fr;gap:12px 16px;align-items:start;margin:0}
.info dt{color:var(--blue);display:grid;place-items:center;height:21px}
.info dd{margin:0;min-width:0}
.info dd small{display:block;color:var(--muted);font-size:12px}
.caution{display:flex;gap:10px;align-items:flex-start;background:#fef7e0;border-radius:8px;padding:10px 12px;color:#3c4043;font-size:13px;line-height:1.5}
.caution svg{flex:none;margin-top:1px}
.chart-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.key{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:5px}
.key i{display:inline-block;width:9px;height:9px}
.key .k-dry{border-radius:50%;background:var(--series)}
.key .k-rain{background:var(--rain);transform:rotate(45deg) scale(.9)}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{stroke:var(--axis);stroke-width:1}
.chart .tick{fill:#80868b;font-family:var(--f);font-size:11px;font-variant-numeric:tabular-nums}
.chart .ref{stroke:#9aa0a6;stroke-width:1}
.chart .ref.ev{stroke:var(--blue)}
.chart .ref-label{fill:var(--muted);font-size:11px;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.chart .area{fill:var(--series);opacity:.1}
.chart .line{fill:none;stroke:var(--series);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt-dry{fill:var(--series);stroke:var(--surface);stroke-width:2}
.chart .pt-rain{fill:var(--rain);stroke:var(--surface);stroke-width:2}
.chart .pt-miss{fill:none;stroke:#9aa0a6;stroke-width:1.4}
.chart .pt-sel{fill:none;stroke:var(--ink);stroke-width:1.5}
.chart .end-label{fill:var(--ink);font-size:12px;font-weight:500}
.chart .xhair{stroke:var(--muted);stroke-width:1}
.chart g.pt{outline:none}
.chart g.pt:focus-visible .focus-ring{stroke:var(--blue);stroke-width:2}
.ev-note{font-size:12.5px;color:var(--muted)}
.evi{display:inline-block;margin-right:12px}
.linkbtn{border:0;background:none;color:var(--blue);font-weight:500;font-size:12.5px;padding:0 2px;margin-left:6px;text-decoration:underline;text-underline-offset:2px}
.pend{display:inline-flex;align-items:center;gap:2px;margin-left:6px;font-size:12px;color:var(--warn);white-space:nowrap}
.info a{color:var(--blue);font-weight:500}
.mini{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.mini table{min-width:0}
.mini th,.mini td{padding:7px 10px;font-size:13px}
.mini td.note{color:var(--muted);min-width:120px}
.raintag{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.raintag i{width:7px;height:7px;background:var(--rain);transform:rotate(45deg)}
form.stack{display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:14px;color:var(--ink);background:#fff;width:100%}
label.f input[aria-invalid="true"],label.f select[aria-invalid="true"]{border-color:var(--crit)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:8px;align-items:center}
.check input{width:18px;height:18px;accent-color:var(--blue)}
.err{color:var(--crit);font-size:13px}
.hint{color:var(--muted);font-size:12.5px}
.locbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#f8f9fa;border-radius:8px;padding:8px 12px}
.btn{height:36px;border-radius:18px;border:1px solid var(--line);background:#fff;color:var(--blue);padding:0 20px;font-weight:500}
.btn:hover{background:#f8f9fa}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1765cc}
.btn.small{height:32px;padding:0 14px}
.closebtn{position:absolute;top:66px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:var(--shadow);display:grid;place-items:center;z-index:2}

/* corners */
.fab{position:absolute;z-index:900;right:12px;bottom:132px;height:48px;border-radius:24px;border:0;background:var(--blue);color:#fff;font-weight:500;padding:0 20px 0 14px;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:8px}
.fab:hover{background:#1765cc}
.layerbtn{position:absolute;z-index:900;left:12px;bottom:34px;width:72px;height:72px;border-radius:10px;border:2px solid #fff;box-shadow:var(--shadow);padding:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;font-size:12px;font-weight:500;color:#fff;transition:left .2s}
.layerbtn span{background:rgba(0,0,0,.55);width:100%;padding:3px 0}
.layerbtn.sat{background:linear-gradient(160deg,#2f4a2c,#55713f 45%,#2c5a73)}
.layerbtn.road{background:linear-gradient(160deg,#f3efe6 0 38%,#fff 38% 46%,#f3efe6 46% 62%,#aad3df 62%)}
.legend{position:absolute;z-index:900;left:96px;bottom:34px;background:var(--surface);border-radius:10px;box-shadow:var(--shadow);padding:8px 12px;display:flex;flex-direction:column;gap:4px;font-size:12px;transition:left .2s;max-width:calc(100% - 180px)}
.legend .lg1{display:flex;align-items:center;gap:8px;white-space:nowrap}
.legend .lg1 b{font-weight:500;font-size:12.5px}
.legend .bar{width:132px;height:8px;border-radius:4px;background:linear-gradient(to right,#fee6d5,#f6caab,#e9ac7d,#d78e55,#bb7234,#9a5920,#794312);flex:none}
.legend .lg2{color:var(--muted)}
body.panel-open .layerbtn{left:412px} body.panel-open .legend{left:496px}
.notice{position:absolute;z-index:900;left:50%;transform:translateX(-50%);bottom:6px;background:rgba(32,33,36,.82);color:#fff;border-radius:12px;padding:2px 12px;font-size:12px;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.pickbar{position:absolute;z-index:1050;left:50%;transform:translateX(-50%);top:76px;background:var(--ink);color:#fff;border-radius:24px;padding:8px 18px;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
.offline{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

/* list sheet */
.scrim{position:absolute;inset:0;z-index:1200;background:rgba(32,33,36,.45);display:flex;justify-content:center;align-items:flex-start;padding:24px 16px;overflow-y:auto}
.sheet{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:1040px;padding:20px 24px 24px;display:flex;flex-direction:column;gap:18px}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet h2{margin:0;font-size:22px;font-weight:400}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.stat{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.stat h3{margin:0;font-size:13px;font-weight:500;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:2px}
.brow,.drow{display:grid;grid-template-columns:minmax(0,8.5em) minmax(0,1fr);gap:10px;align-items:center;width:100%;border:0;background:none;padding:4px 6px;border-radius:8px;text-align:left;color:var(--ink)}
.drow{grid-template-columns:minmax(0,8.5em) minmax(0,1fr) 2.8em}
.brow:hover,.drow:hover,.brow:focus-visible,.drow:focus-visible{background:var(--hover)}
.rname{font-size:13px;line-height:1.35;display:flex;gap:6px;align-items:center;overflow-wrap:anywhere}
.rname svg{width:12px;height:12px;flex:none;color:var(--muted)}
.btrack{display:flex;align-items:center;gap:8px;min-width:0}
.bar{height:12px;border-radius:0 4px 4px 0;background:var(--series);flex:none}
.bval{font-family:var(--mono);font-size:12px;color:var(--ink)}
.bval.none{font-family:var(--f);color:var(--muted)}
.dtrack{position:relative;height:20px}
.dline{position:absolute;top:9px;height:2px;background:var(--axis)}
.ddot{position:absolute;top:10px;width:10px;height:10px;margin:-5px 0 0 -5px;box-shadow:0 0 0 2px var(--surface)}
.ddot.dry{border-radius:50%;background:var(--series)}
.ddot.wet{background:var(--rain);transform:rotate(45deg)}
.ddelta{font-family:var(--mono);font-size:12px;text-align:right}
.daxis{display:grid;grid-template-columns:minmax(0,8.5em) minmax(0,1fr) 2.8em;gap:10px;padding:0 6px}
.daxis .ticks{position:relative;height:16px;border-top:1px solid var(--axis);font-size:11px;color:#80868b}
.daxis .ticks span{position:absolute;top:2px;transform:translateX(-50%)}
.daxis .ticks span:first-child{transform:none}
.daxis .ticks span:last-child{transform:translateX(-100%)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
.tablebox table{min-width:700px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap;background:#f8f9fa}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
td.r,th.r{text-align:right}
.tablebox tbody tr{cursor:pointer}
.tablebox tbody tr:hover{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
td.t{font-weight:500}
td.t .sub{display:block;font-weight:400;font-size:13px}
.copyrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.copyrow textarea{width:100%;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}

/* tooltip & toast */
.tip{position:fixed;z-index:3000;pointer-events:none;max-width:240px;background:var(--surface);color:var(--ink);border-radius:8px;box-shadow:var(--shadow);padding:8px 10px;font-size:12.5px;line-height:1.45}
.tip .tv{font-size:18px;font-weight:500;line-height:1.2}
.tip .tl{color:var(--muted)}
.tip .tk{display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:6px}
.toast{position:absolute;z-index:3000;left:50%;bottom:40px;transform:translateX(-50%);background:#323232;color:#fff;border-radius:8px;padding:12px 16px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:900px){
  .top{flex-wrap:wrap;gap:4px 10px}
  .searchwrap{flex:1 1 100%}
  .chips{flex:1 1 100%;padding-bottom:4px}
  .tools{flex:1 1 100%;overflow-x:auto;padding:2px 4px 6px}
  .panel{top:auto;height:58%;width:100%;border-radius:16px 16px 0 0}
  .panel .scroll{padding-top:0}
  .closebtn{top:10px}
  body.panel-open .layerbtn,body.panel-open .legend,body.panel-open .fab,body.panel-open .notice{display:none}
  .legend{left:96px;bottom:34px;max-width:calc(100% - 156px)}
  .legend .lg2{display:none}
  .legend .bar{width:72px}
  #round-l{display:none}
  .pillsel{padding-left:12px}
  .pillsel select{max-width:8.5em}
  .pickbar{top:150px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="searchwrap">
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#5f6368" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>
      <input id="q" type="search" autocomplete="off">
      <button type="button" class="x" id="q-clear" hidden><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#5f6368" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
    </div>
    <div class="results" id="results" hidden></div>
  </div>
  <div class="chips" id="chips" role="group"></div>
  <div class="tools">
    <label class="pillsel" for="round"><span id="round-l"></span><select id="round"></select></label>
    <button type="button" class="pillbtn" id="open-list"></button>
    <div class="seg" role="group" id="lang-group">
      <button type="button" id="l-ko">한국어</button><button type="button" id="l-en">EN</button>
    </div>
  </div>
</div>

<div class="pickbar" id="pickbar" hidden></div>

<aside class="panel" id="panel" hidden>
  <button type="button" class="closebtn" id="panel-close"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#5f6368" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>

const L_ = (o) => o == null ? '' : (typeof o === 'string' ? o : (o[S.lang] ?? o.ko ?? ''));
const DAY = 86400000;

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = (iso) => { const [, m, d] = iso.split('-').map(Number); return S.lang === 'ko' ? `${m}월 ${d}일` : `${MON[m - 1]} ${d}`; };
const fmtTemp = (c) => c == null ? '–' : c.toFixed(1);
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k]; if (v == null || v === false) continue;
    if (k === 'class') el.className = v; else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v;            /* only ever used with static icon markup */
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()){ if (kid == null || kid === false || kid === '') continue; el.append(kid instanceof Node ? kid : document.createTextNode(String(kid))); }
  return el;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs, parent){ const el = document.createElementNS(SVGNS, tag); if (attrs) for (const k in attrs) if (attrs[k] != null) el.setAttribute(k, attrs[k]); if (parent) parent.appendChild(el); return el; }

/* ---------- colour: one sediment hue, light (clear) to dark (muddy) ---------- */
const RAMP = ['#fee6d5','#f6caab','#e9ac7d','#d78e55','#bb7234','#9a5920','#794312'].map(x => [1,3,5].map(i => parseInt(x.slice(i, i + 2), 16)));
function rampColor(v){
  const p = Math.max(0, Math.min(1, v / CONFIG.INDEX_MAX)) * (RAMP.length - 1);
  const i = Math.min(RAMP.length - 2, Math.floor(p)), f = p - i;
  return '#' + RAMP[i].map((a, k) => Math.round(a + (RAMP[i + 1][k] - a) * f).toString(16).padStart(2, '0')).join('');
}
function textOn(hex){
  const [r, g, b] = [1,3,5].map(i => { const x = parseInt(hex.slice(i, i + 2), 16) / 255; return x <= 0.04045 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4; });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.3 ? '#202124' : '#ffffff';
}

/* ---------- data helpers ---------- */
const src = (id) => S.sources.find(x => x.id === id);
const measOf = (id) => S.meas.filter(m => m.source === id).sort((a, b) => toT(a.date) - toT(b.date) || (a.at || 9e15) - (b.at || 9e15));
const latestOf = (id) => measOf(id).filter(m => m.turbidity != null).pop() || null;
const atRound = (id) => S.round === 'latest' ? latestOf(id) : (measOf(id).find(m => m.date === S.round) || null);
const valueOf = (id) => { const m = atRound(id); return m && m.turbidity != null ? m.turbidity : null; };
function rounds(){
  const mp = new Map();
  for (const m of S.meas) mp.set(m.date, (mp.get(m.date) || false) || !!m.rain);
  return [...mp.entries()].sort((a, b) => toT(b[0]) - toT(a[0])).map(([date, rain]) => ({date, rain}));
}
const roundLabel = () => S.round === 'latest' ? t('latest') : fmtDate(S.round) + (rounds().find(r => r.date === S.round)?.rain ? ' · ' + t('afterRain') : '');
const visible = () => S.sources.filter(x => S.types.has(x.type));

/* ---------- shapes for the source types ---------- */
function shapeInner(type, cx, cy, r){
  if (type === 'well') return `<circle cx="${cx}" cy="${cy}" r="${r}"/>`;
  if (type === 'tap'){ const a = r * 0.92; return `<rect x="${cx - a}" y="${cy - a}" width="${2 * a}" height="${2 * a}" rx="${r * 0.3}"/>`; }
  if (type === 'stream'){ const a = r * 1.2; return `<path d="M${cx} ${cy - a}L${cx + a} ${cy}L${cx} ${cy + a}L${cx - a} ${cy}Z"/>`; }
  const p = []; for (let k = 0; k < 6; k++){ const a = (-90 + 60 * k) * Math.PI / 180; p.push((cx + r * 1.1 * Math.cos(a)).toFixed(2) + ',' + (cy + r * 1.1 * Math.sin(a)).toFixed(2)); }
  return `<polygon points="${p.join(' ')}"/>`;
}
const typeIcon = (type) => `<svg viewBox="0 0 16 16" aria-hidden="true"><g style="fill:none;stroke:currentColor;stroke-width:1.7">${shapeInner(type, 8, 8, 5.4)}</g></svg>`;
const PIN = 'M15 1.5C8 1.5 2.5 7 2.5 14c0 9.3 12.5 24 12.5 24s12.5-14.7 12.5-24C27.5 7 22 1.5 15 1.5z';

  const fill = v == null ? '#ffffff' : rampColor(v);
  const ink = v == null ? '#5f6368' : textOn(fill);
  const label = v == null ? '–' : String(Math.round(v));
  const fs = label.length > 2 ? 9.6 : 11.5;
  return `<svg width="${w}" height="${(w * 4 / 3).toFixed(1)}" viewBox="0 0 30 40" aria-hidden="true">` +
    `<path d="${PIN}" fill="none" stroke="rgba(60,64,67,.45)" stroke-width="3"/>` +
    `<path d="${PIN}" fill="${fill}" stroke="${v == null ? '#80868b' : '#fff'}" stroke-width="1.5"${v == null ? ' stroke-dasharray="3 2.4"' : ''}/>` +
    `<text x="15" y="14" dy="0.36em" text-anchor="middle" style="font:700 ${fs}px Roboto,'Noto Sans KR',sans-serif;fill:${ink}">${label}</text>` +
    `<g transform="translate(26 4.5)"><circle r="5.8" fill="#fff" stroke="rgba(60,64,67,.4)" stroke-width=".8"/><g style="fill:none;stroke:#3c4043;stroke-width:1.15">${shapeInner(type, 0, 0, 2.8)}</g></g></svg>`;
}

/* ---------- map ---------- */
let map, layerRoad, layerSat, pins, draftPin = null;
function initMap(){
  map = L.map('map', {zoomControl:false, center:CONFIG.HOME, zoom:17, maxZoom:20, minZoom:5});
  L.control.zoom({position:'bottomright'}).addTo(map);
  /* Street map: the humanitarian OpenStreetMap style. The main openstreetmap.org tile server refuses pages opened straight from disk, so it is not used. */
  const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}';
  layerRoad = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {subdomains:'abc', maxZoom:20, maxNativeZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, style by <a href="https://www.hotosm.org/">HOT</a>, hosted by OSM France'}).addTo(map);
  /* If that server blocks or fails, switch to a plainer street map. */
  let swapped = false, fails = 0;
  const swap = () => {
    if (swapped) return; swapped = true;
    map.attributionControl.removeAttribution(layerRoad.options.attribution);
    layerRoad.options.attribution = 'Tiles &copy; Esri';
    if (map.hasLayer(layerRoad)) map.attributionControl.addAttribution(layerRoad.options.attribution);
    layerRoad.setUrl(ESRI);
  };
  layerRoad.on('tileerror', () => { if (++fails >= 2) swap(); });
  const probe = new Image(); probe.onerror = swap; probe.src = 'https://a.tile.openstreetmap.fr/hot/17/111054/61465.png';
  layerSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:20, maxNativeZoom:18, attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics'});
  pins = L.layerGroup().addTo(map);
  map.on('click', (e) => {

function renderLineChart(host, x, all, evs){
  host.replaceChildren();
  const W = Math.max(260, Math.floor(host.clientWidth || 352)), H = 214, m = {t:38, r:30, b:26, l:32};
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const dates = S.meas.map(r => toT(r.date)).concat(S.events.map(e => toT(e.date)), [toT(CONFIG.RETURN_DATE)]);
  const t0 = Math.min(...dates) - 2 * DAY, t1 = Math.max(...dates) + 3 * DAY;
  const X = (tt) => m.l + (tt - t0) / (t1 - t0) * pw, Y = (v) => m.t + ph - Math.min(v, CONFIG.INDEX_MAX) / CONFIG.INDEX_MAX * ph;
  const svg = s('svg', {width:W, height:H, viewBox:`0 0 ${W} ${H}`, role:'img', 'aria-labelledby':'ct cd'});
  s('title', {id:'ct'}, svg).textContent = t('chartH') + ' · ' + L_(x.name);
  s('desc', {id:'cd'}, svg).textContent = t('chartDesc', {name:L_(x.name)});
  for (const v of [0, 40, 80, 120]){
    s('line', {x1:m.l, x2:m.l + pw, y1:Y(v), y2:Y(v), class:v ? 'grid' : 'axis'}, svg);
    s('text', {x:m.l - 7, y:Y(v), dy:'0.32em', 'text-anchor':'end', class:'tick'}, svg).textContent = String(v);
  }
  const md = S.meas.map(r => r.date).sort((a, b) => toT(a) - toT(b)), firstD = md[0], lastD = md[md.length - 1];
  const ticks = [toT(firstD)]; const fd = new Date(toT(firstD));
  for (let d = Date.UTC(fd.getUTCFullYear(), fd.getUTCMonth() + 1, 1); d <= toT(lastD); d = Date.UTC(new Date(d).getUTCFullYear(), new Date(d).getUTCMonth() + 1, 1)) ticks.push(d);
  ticks.push(toT(lastD));
  let lastX = -999;
  for (const tt of ticks){
    const xx = X(tt); if (xx - lastX < 38) continue; lastX = xx;
    const dd = new Date(tt); s('text', {x:xx, y:m.t + ph + 17, 'text-anchor':'middle', class:'tick'}, svg).textContent = (dd.getUTCMonth() + 1) + '/' + dd.getUTCDate();
  }
  /* labels sit to the right of their line, or to the left when the line is near the right edge */
  const flag = (xx, y, txt) => { const left = xx > m.l + pw * 0.55; s('text', {x:left ? xx - 5 : xx + 5, y, 'text-anchor':left ? 'end' : 'start', class:'ref-label'}, svg).textContent = txt; };
  const xr = X(toT(CONFIG.RETURN_DATE));
  s('line', {x1:xr, x2:xr, y1:m.t - 30, y2:m.t + ph, class:'ref'}, svg);
  flag(xr, m.t - 21, t('refReturn'));
  for (const e of evs){
    const xe = X(toT(e.date));
    s('line', {x1:xe, x2:xe, y1:m.t - 14, y2:m.t + ph, class:'ref ev'}, svg);
    flag(xe, m.t - 5, L_(e.label));
  }
  const runs = []; let run = [];
  for (const r of all){ if (r.turbidity == null){ if (run.length) runs.push(run); run = []; } else run.push(r); }
  if (run.length) runs.push(run);
  for (const rn of runs){
    if (rn.length < 2) continue;
    let d = ''; rn.forEach((r, i) => { d += (i ? 'L' : 'M') + X(toT(r.date)).toFixed(1) + ',' + Y(r.turbidity).toFixed(1); });
    s('path', {d:d + `L${X(toT(rn[rn.length - 1].date)).toFixed(1)},${Y(0)}L${X(toT(rn[0].date)).toFixed(1)},${Y(0)}Z`, class:'area'}, svg);
    s('path', {d, class:'line'}, svg);
  }
  const xh = s('line', {x1:0, x2:0, y1:m.t, y2:m.t + ph, class:'xhair', visibility:'hidden'}, svg);
  const showAt = (r, cx, cy) => { const xx = X(toT(r.date)); xh.setAttribute('x1', xx); xh.setAttribute('x2', xx); xh.setAttribute('visibility', 'visible'); showTip(readingTip(r), cx, cy); };
  const hideAt = () => { xh.setAttribute('visibility', 'hidden'); hideTip(); };
  const g0 = s('g', null, svg);
  for (const r of all){
    const xx = X(toT(r.date));
    const g = s('g', {class:'pt', tabindex:0, role:'img'}, g0);
    g.setAttribute('aria-label', fmtDate(r.date) + ', ' + (r.turbidity != null ? t('turb') + ' ' + r.turbidity : t('notMeasured')) + (r.rain ? ', ' + t('afterRain') : ''));
    if (r.turbidity == null){
      const y = Y(0) - 9;
      s('path', {d:`M${xx - 4},${y - 4}L${xx + 4},${y + 4}M${xx + 4},${y - 4}L${xx - 4},${y + 4}`, class:'pt-miss'}, g);
      s('circle', {cx:xx, cy:y, r:9, class:'focus-ring', fill:'none', stroke:'transparent'}, g);
    } else {
      const y = Y(r.turbidity);
      if (S.round !== 'latest' && r.date === S.round) s('circle', {cx:xx, cy:y, r:9.5, class:'pt-sel'}, g);
      if (r.rain) s('rect', {x:xx - 4.6, y:y - 4.6, width:9.2, height:9.2, transform:`rotate(45 ${xx} ${y})`, class:'pt-rain'}, g);
      else s('circle', {cx:xx, cy:y, r:4.8, class:'pt-dry'}, g);
      s('circle', {cx:xx, cy:y, r:10, class:'focus-ring', fill:'none', stroke:'transparent'}, g);
    }
    g.addEventListener('focus', () => { const b = g.getBoundingClientRect(); showAt(r, b.right, b.top); });
    g.addEventListener('blur', hideAt);
  }
  const lastRun = runs[runs.length - 1], endR = lastRun ? lastRun[lastRun.length - 1] : null;
  if (endR) s('text', {x:X(toT(endR.date)) + 9, y:Y(endR.turbidity), dy:'0.32em', class:'end-label'}, svg).textContent = String(endR.turbidity);
  const hit = s('rect', {x:m.l, y:m.t - 6, width:pw, height:ph + 12, fill:'transparent', style:'cursor:crosshair'}, svg);
  hit.addEventListener('pointermove', (e) => {
    const px = e.clientX - svg.getBoundingClientRect().left; let best = null, bd = Infinity;
    for (const r of all){ const d = Math.abs(X(toT(r.date)) - px); if (d < bd){ bd = d; best = r; } }
    if (best) showAt(best, e.clientX, e.clientY);
  });
  hit.addEventListener('pointerleave', hideAt);
  host.append(svg);
}

/* ---------- the shared database ---------- */
/* Anyone can add rows, so nothing read from the database (or from this browser's storage) is trusted:

const HEX64 = /^[0-9a-f]{64}$/;
const isISO = (v) => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
const str = (v, n) => typeof v === 'string' ? v.trim().slice(0, n) : '';
const both = (ko, en) => en ? {ko:ko || en, en} : ko;
const owner = (v) => typeof v === 'string' && HEX64.test(v) ? v : null;
const when = (v) => { const n = Date.parse(v); return Number.isFinite(n) ? n : 0; };
function cleanSource(r){
  if (!r || !Number.isInteger(r.id) || !TYPES.includes(r.kind)) return null;
  const lat = Number(r.lat), lng = Number(r.lng), name = str(r.name, 60);
  if (!Number.isFinite(lat) || !Number.isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180 || !name) return null;
  return {id:'S' + r.id, db:r.id, type:r.kind, lat, lng, name:both(name, str(r.name_en, 60)), desc:both(str(r.description, 200), str(r.description_en, 200)),
    problemId:Number.isInteger(r.problem_id) ? r.problem_id : null, example:r.is_example === true, owner:owner(r.owner_hash), at:when(r.created_at)};
}
function cleanReading(r){
  if (!r || !Number.isInteger(r.id) || !Number.isInteger(r.source_id) || !isISO(r.measured_on)) return null;
  const tb = r.turbidity == null ? null : Number(r.turbidity), tc = r.temp_c == null ? null : Number(r.temp_c);
  if (tb != null && !(Number.isInteger(tb) && tb >= 0 && tb <= 300)) return null;
  if (tc != null && !(Number.isFinite(tc) && tc >= 0 && tc <= 50)) return null;
  const note = both(str(r.note, 200), str(r.note_en, 200));
  return {db:r.id, source:'S' + r.source_id, date:r.measured_on, turbidity:tb, temp:tc, rain:r.rained === true, by:str(r.measured_by, 40), note:note || null,
    example:r.is_example === true, owner:owner(r.owner_hash), at:when(r.created_at)};
}
function cleanEvent(r){
  if (!r || !Number.isInteger(r.id) || !Number.isInteger(r.source_id) || !isISO(r.happened_on)) return null;
  const label = str(r.label, 60); if (!label) return null;
  return {db:r.id, source:'S' + r.source_id, date:r.happened_on, label:both(label, str(r.label_en, 60)), example:r.is_example === true, owner:owner(r.owner_hash), at:when(r.created_at)};
}
function cleanTitle(o){
  if (typeof o === 'string') return o.slice(0, 120);
  if (!o || typeof o !== 'object') return '';
  return both(str(o.ko, 120), str(o.en, 120));
}
function build(raw){
  const sources = (raw.a || []).map(cleanSource).filter(Boolean), ids = new Set(sources.map(x => x.id));
  const probs = {};
  (raw.p || []).forEach(p => { if (p && Number.isInteger(p.id) && p.del !== true) probs[p.id] = {no:String(p.id).padStart(3, '0'), title:cleanTitle(p.title), pub:p.pub === true}; });

}
async function api(path, opt = {}){
  const r = await fetch(CONFIG.DB_URL + path, {...opt, cache:'no-store', headers:{apikey:CONFIG.DB_KEY, 'Content-Type':'application/json', ...(opt.headers || {})}});
  if (!r.ok){ const err = new Error('db ' + r.status); err.status = r.status; throw err; }
  return r.status === 204 ? null : r.json().catch(() => null);
}
async function apiAll(path){
  const out = [], page = 1000;
  for (let off = 0; ; off += page){
    const rows = await api(`${path}&limit=${page}&offset=${off}`);
    if (!Array.isArray(rows)) break;
    out.push(...rows); if (rows.length < page) break;
  }
  return out;
}
async function pull(){
  const [a, b, c] = await Promise.all([
    apiAll('/water_sources?select=id,kind,name,name_en,description,description_en,lat,lng,problem_id,is_example,owner_hash,created_at&order=id'),
    apiAll('/water_readings?select=id,source_id,measured_on,turbidity,temp_c,rained,measured_by,note,note_en,is_example,owner_hash,created_at&order=measured_on,id'),
    apiAll('/water_events?select=id,source_id,happened_on,label,label_en,is_example,owner_hash,created_at&order=happened_on,id')]);
  const pids = [...new Set(a.map(r => r && r.problem_id).filter(Number.isInteger))];
  let p = [];
  if (pids.length){ try { p = await api('/problems?select=id,title:data->title,pub:data->pub,del:data->del&id=in.(' + pids.join(',') + ')') || []; } catch (_) {} }
  return {a, b, c, p};
}

/* New rows wait in a queue kept in this browser. They are sent at once, or when the connection comes back.
   Each device keeps a random secret (TOKEN) and sends only its SHA-256 (MINE) with every row,
   so it can prove later that a row is its own and remove it within 24 hours. */
let BASE = {sources:[], meas:[], events:[]}, Q = [], REMAP = {}, TOKEN = '', MINE = null;
let ver = 0, sig = '', pulling = false, flushing = false, fitted = false;
const tmpId = (k) => k + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fin = (v, lo, hi) => typeof v === 'number' && Number.isFinite(v) && v >= lo && v <= hi;
function validOp(o){
  if (!o || typeof o.tmp !== 'string' || !o.row || typeof o.row !== 'object') return false;
  const r = o.row;
  if (o.t === 'source') return TYPES.includes(r.kind) && !!str(r.name, 60) && fin(r.lat, -90, 90) && fin(r.lng, -180, 180);
  if (typeof o.src !== 'string') return false;
  if (o.t === 'reading') return isISO(r.measured_on) && Number.isInteger(r.turbidity) && fin(r.turbidity, 0, 300) && fin(r.temp_c, 0, 50) && typeof r.rained === 'boolean' && typeof r.measured_by === 'string' && (r.note == null || typeof r.note === 'string');
  if (o.t === 'event') return isISO(r.happened_on) && !!str(r.label, 60);
  return false;
}
const saveQ = () => { try { localStorage.setItem(CONFIG.QUEUE_KEY, JSON.stringify(Q)); } catch (_) {} };
function compose(){
  const sources = BASE.sources.slice(), meas = BASE.meas.slice(), events = BASE.events.slice(), known = new Set(sources.map(x => x.id));
  for (const o of Q){
    const sid = REMAP[o.src] || o.src, r = o.row;
    if (o.t === 'source'){ sources.push({id:o.tmp, tmp:o.tmp, type:r.kind, lat:r.lat, lng:r.lng, name:str(r.name, 60), desc:'', pending:true}); known.add(o.tmp); }
    else if (o.t === 'reading' && known.has(sid)) meas.push({tmp:o.tmp, source:sid, date:r.measured_on, turbidity:r.turbidity, temp:r.temp_c, rain:r.rained, by:str(r.measured_by, 40), note:r.note ? str(r.note, 200) : null, pending:true});
    else if (o.t === 'event' && known.has(sid)) events.push({tmp:o.tmp, source:sid, date:r.happened_on, label:str(r.label, 60), pending:true});
  }
  S.sources = sources; S.meas = meas; S.events = events;
  if (S.sel && !src(S.sel)) S.sel = null;
}
const canUndo = (it) => !!it && (it.pending || (!!MINE && it.owner === MINE && Date.now() - it.at < CONFIG.UNDO_MS - 60000));
function mineTag(kind, it){
  if (it.pending) return h('span', {class:'pend'}, t('tagPending'), h('button', {type:'button', class:'linkbtn', 'data-act':'undo', 'data-kind':kind, 'data-tmp':it.tmp, text:t('cancel')}));
  if (canUndo(it)) return h('button', {type:'button', class:'linkbtn', 'data-act':'undo', 'data-kind':kind, 'data-id':it.db, text:t('undo')});
  return null;
}
/* Redraw everything except a form someone is typing into. */
function softRender(){
  const pb = $('panel-body'), y = pb.scrollTop;
  drawChrome(); drawPins(); drawSheet();
  if (S.mode !== 'form'){ drawPanel(); pb.scrollTop = y; }
}
/* A refusal from the database (bad value, source gone) can never succeed, so that row is dropped.
   Anything else (no connection, server busy) is kept and tried again later. */
const offlineErr = (e) => !e.status || [401, 403, 408, 429].includes(e.status) || e.status >= 500;
function adopt(kind, row, tmp){
  if (kind === 'source'){
    const x = cleanSource(row); if (!x) return;
    BASE.sources.push(x); REMAP[tmp] = x.id;
    Q.forEach(o => { if (o.src === tmp) o.src = x.id; });
    if (S.sel === tmp) S.sel = x.id;
    if (S.formSource === tmp) S.formSource = x.id;
  } else if (kind === 'reading'){ const m = cleanReading(row); if (m) BASE.meas.push(m); }
  else { const e = cleanEvent(row); if (e) BASE.events.push(e); }
}
async function flush(announce){
  if (flushing) return;
  flushing = true; let refused = false;
  while (Q.length){
    const o = Q[0], sid = REMAP[o.src] || o.src;
    try {
      if (o.t !== 'source' && !/^S\d+$/.test(sid)) throw Object.assign(new Error('no source'), {status:409});
      const table = o.t === 'source' ? 'water_sources' : o.t === 'reading' ? 'water_readings' : 'water_events';
      const body = {...o.row};
      if (o.t !== 'source') body.source_id = Number(sid.slice(1));
      if (MINE) body.owner_hash = MINE;
      const res = await api('/' + table, {method:'POST', headers:{Prefer:'return=representation'}, body:JSON.stringify(body)});
      Q.shift(); ver++;
      if (Array.isArray(res) && res[0]) adopt(o.t, res[0], o.tmp);
      saveQ();
    } catch (e){
      if (offlineErr(e)) break;
      Q.shift(); ver++; refused = true;
      if (o.t === 'source') Q = Q.filter(x => x.src !== o.tmp);
      saveQ();
    }
  }
  flushing = false;
  compose(); softRender();
  if (refused) toast(t('rejected'));
  else if (announce) toast(Q.length ? t('savedLocal') : t('saved'));
  if (!Q.length) refresh();
}
function firstLook(){
  if (fitted || !S.sources.length) return;
  fitted = true;
  if (window.innerWidth > 900 && !S.sel && src('S8')) S.sel = 'S8';
  render(); fitAll();
}
async function refresh(){
  if (Q.length){ if (!flushing) flush(false); return; }
  if (flushing || pulling || document.hidden) return;
  pulling = true; const v = ver; let raw;
  try { raw = await pull(); }
  catch (_) {
    pulling = false;
    const st = BASE.sources.length ? 'cache' : 'fail';
    if (S.status !== st){ S.status = st; drawChrome(); }
    return;
  }
  pulling = false;
  if (v !== ver || Q.length){ setTimeout(refresh, 300); return; }   /* something changed here while downloading: ask again */
  S.status = 'live'; S.at = Date.now();
  try { localStorage.setItem(CONFIG.CACHE_KEY, JSON.stringify({raw, at:S.at})); } catch (_) {}
  const n = JSON.stringify(raw);
  if (n !== sig){ sig = n; BASE = build(raw); compose(); softRender(); firstLook(); }
  else drawChrome();
}
async function undo(kind, id, tmp){
  if (!['source', 'reading', 'event'].includes(kind) || !confirm(t('undoQ'))) return;
  if (tmp){
    Q = Q.filter(o => o.tmp !== tmp && !(kind === 'source' && o.src === tmp)); ver++; saveQ(); compose();
    if (S.sel === tmp) S.sel = null;
    render(); toast(t('undone')); return;
  }
  const n = Number(id); if (!Number.isInteger(n)) return;
  try {
    const ok = await api('/rpc/water_undo', {method:'POST', body:JSON.stringify({p_kind:kind, p_id:n, p_token:TOKEN})});
    if (ok !== true){ toast(t('undoFail')); return; }
    ver++;
    if (kind === 'reading') BASE.meas = BASE.meas.filter(m => m.db !== n);
    if (kind === 'event') BASE.events = BASE.events.filter(e => e.db !== n);
    if (kind === 'source'){ const sid = 'S' + n; BASE.sources = BASE.sources.filter(x => x.id !== sid); BASE.meas = BASE.meas.filter(m => m.source !== sid); BASE.events = BASE.events.filter(e => e.source !== sid); }
    compose(); render(); toast(t('undone')); refresh();
  } catch (e){ toast(offlineErr(e) ? t('undoOffline') : t('undoFail')); }
}

/* ---------- start ---------- */
try {
  const c = JSON.parse(localStorage.getItem(CONFIG.CACHE_KEY) || 'null');
  if (c && c.raw && typeof c.raw === 'object'){ BASE = build(c.raw); S.status = 'cache'; S.at = Number(c.at) || null; }
} catch (_) {}
try { const q = JSON.parse(localStorage.getItem(CONFIG.QUEUE_KEY) || '[]'); if (Array.isArray(q)) Q = q.filter(validOp); } catch (_) {}
try { TOKEN = localStorage.getItem(CONFIG.TOKEN_KEY) || ''; } catch (_) {}
if (!/^[0-9a-f]{32}$/.test(TOKEN)){
  const a = new Uint8Array(16); crypto.getRandomValues(a); TOKEN = [...a].map(b => b.toString(16).padStart(2, '0')).join('');
  try { localStorage.setItem(CONFIG.TOKEN_KEY, TOKEN); } catch (_) {}
}
compose();
if (window.L) initMap(); else $('map').replaceChildren(h('div', {class:'offline', text:T.offline.ko + ' / ' + T.offline.en}));
render();
firstLook();
let rz = null;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (map) map.invalidateSize(); if (S.mode === 'idle' && S.sel) drawPanel(); }, 150); });
(async () => {
  try { if (crypto.subtle){ const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(TOKEN)); MINE = [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join(''); } } catch (_) {}
  softRender();
  refresh();
})();
setInterval(refresh, CONFIG.POLL_MS);
window.addEventListener('online', refresh);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
</script>
